aid: dabba
name: Dabba
description: 'Dabba (Wifi Dabba) is a Web3-powered decentralized physical infrastructure
  network (DePIN) that brings affordable internet connectivity to emerging markets,
  starting in India. It deploys low-cost Dabba Lite WiFi hotspots through a network
  of local cable operators (LCOs) and rewards hotspot owners, location owners, backhaul
  providers, and hardware manufacturers with DBT tokens as data is consumed. Network
  activity — NFTs, subscriber revenue, and bandwidth usage — is reported onchain, and
  the token flows through a mint, buyback, and burn model. Surfaced as a Multicoin
  Capital portfolio company; profiled here from public developer, documentation, and
  onchain surfaces.'
